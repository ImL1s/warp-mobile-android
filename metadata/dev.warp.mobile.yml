# APK: Gradle :app:assembleRelease (unsigned — F-Droid re-signs)
# Native: cargo-ndk + companion warp-src / termux-packages pins
# Bootstrap: tools/scripts/build-bootstrap.sh (sha-pinned Termux apt snapshot)

Categories:
  - System
  - Development

License: AGPL-3.0-only
SourceCode: https://github.com/ImL1s/warp-mobile-android
IssueTracker: https://github.com/ImL1s/warp-mobile-android/issues
Changelog: https://github.com/ImL1s/warp-mobile-android/blob/main/CHANGELOG.md

AutoName: Warp Mobile
Description: |-
    Open-source Android port of Warp Terminal with Block-style command
    grouping, per-cell Vulkan rendering, BYOK cloud AI (Haiku ghost-text +
    Sonnet agent), and a bundled Termux runtime (zsh + GNU coreutils + APT).

    Status: v1.0.0-rc1 engine release on Android 12+ (API 31+) flagship
    devices. Milestones M0–M6 and Waves M-W1–W8 are complete (805 automated
    tests). The Warp Desktop-shaped UX chrome (M7–M10) is still in progress —
    today's launcher path is an honest engine preview, not a full Warp clone.

    What works:
    .
    - Real PTY → terminal model → Vulkan per-cell renderer
    - Bundled Termux $PREFIX with zsh / GNU coreutils / APT
    - BYOK Anthropic AI (settings → API key; ghost-text + agent explain)
    - SSH remote sessions with host-key verification
    - Security hardening (Keystore, logcat scrubbing)
    - MCP tool registry, split panes, local .warprules / skills
    .
    AntiFeatures: NonFreeNet applies when the user enables cloud AI against
    Anthropic's network. Core terminal use works fully offline.

    Distribution: F-Droid + GitHub Releases. Play Store is a later optional path.

RepoType: git
Repo: https://github.com/ImL1s/warp-mobile-android.git

Builds:
  - versionName: 1.0.0-rc1
    versionCode: 100
    commit: v1.0.0-rc1
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y patchelf python3 zip unzip curl
    init: |-
        bash ../tools/scripts/setup-companion-sources.sh
        bash ../tools/scripts/setup-cargo-config.sh
    prebuild: |-
        bash ../tools/scripts/build-bootstrap.sh aarch64 \
            ../tools/scripts/m4-bootstrap-packages.txt \
            ../_bootstrap-out
    build: |-
        ./gradlew :app:assembleRelease
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    ndk: r29

AntiFeatures:
  - NonFreeNet

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0-rc1
CurrentVersionCode: 100
