name: Test (Rust + Android smoke)

# Continuous correctness CI for the warp-mobile-android source tree.
#
# What this catches:
#   - Rust host tests (warp-mobile-android-host: 66 tests including
#     pty / ime / input / terminal_model / bootstrap / font_picker)
#   - Rust AI client tests (warp_ai_mobile: 18 tests for SSE parser +
#     redact + scrub_key + smoke)
#   - Rust facade tests (warp_terminal_mobile_facade in warp-src/:
#     ~73 tests for DCS hooks + Block model + dynamic_grid)
#   - Android Kotlin compile (gradle :app:compileDebugKotlin —
#     catches Kotlin syntax regressions without device tests, since
#     the Android side currently has no JUnit suite; instrumentation
#     tests via test-*.sh drivers are device-only)
#
# What this does NOT catch (deliberate scope):
#   - Device-driver scripts (tools/scripts/test-*.sh) — those need
#     a connected adb device; CI runners don't have hardware
#   - Vulkan / Skia render output — needs GPU + system fonts
#   - Bootstrap zip build — covered by build-bootstrap.yml
#   - Release pipeline — covered by release.yml
#
# Triggers: push to main + PR. Cancels superseded runs in the same
# PR via concurrency: cancel-in-progress.

on:
  push:
    branches: [main]
    # Skip CI on doc-only pushes to save runner minutes. paths-ignore
    # only triggers when ALL changes match — any code touch alongside
    # docs still runs CI. PR triggers below are unconditional so reviews
    # always see a green/red signal.
    paths-ignore:
      - '**.md'
      - '.omc/**'
      - 'progress.txt'
      - 'fastlane/**'
      - 'metadata/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Opt JavaScript actions into Node.js 24 ahead of GitHub's June 2026
  # forced switch (Node 20 removal on September 16, 2026). Surfaces any
  # action incompatibility now rather than at the deprecation cliff.
  # Refs: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync & verify companion sources
        run: bash tools/scripts/setup-companion-sources.sh

      # NOTE: this job does NOT call tools/scripts/setup-cargo-config.sh.
      # That script renders .cargo/config.toml from a template using
      # ANDROID_NDK_ROOT for cross-compilation to aarch64-linux-android.
      # Host tests don't cross-compile (no --target flag), so they don't
      # need the rendered config. Skipping the script avoids a dependency
      # on NDK install in this job.

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            warp-src/target
          # Bump key when Cargo.lock or workspace structure changes
          # to force a clean rebuild. Otherwise reuse the cached
          # artifacts across PR runs.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit (main-repo deps)
        # Audits ONLY the main warp-mobile-android workspace (276 deps).
        # Known upstream advisories are ignored here and in deny.toml.
        # They are transitive deps not directly called in our code paths.
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0190 \
            --ignore RUSTSEC-2026-0186 \
            --ignore RUSTSEC-2026-0204 \
            --ignore RUSTSEC-2026-0185 \
            --ignore RUSTSEC-2026-0206

      # NOTE: cargo deny check is skipped in CI because cargo-metadata
      # can't resolve warp_terminal_mobile_facade's workspace dep
      # inheritance (log, etc.) when warp-src is cloned as a companion
      # repo rather than a proper workspace member. The security audit
      # (cargo audit above) covers RUSTSEC advisories; license compliance
      # is validated by deny.toml locally where the full workspace resolves.
      # TODO: re-enable once warp-src is restructured as a git submodule
      # with proper workspace integration.
      # - name: License + supply-chain check (cargo deny)
      #   run: cargo deny check

      - name: Test warp_ai_mobile (18 tests)
        # warp_ai_mobile has no warp-src deps — runs from main workspace.
        run: cargo test -p warp_ai_mobile --no-fail-fast

      - name: Test warp_terminal_mobile_facade (~73 tests)
        # Facade lives in warp-src workspace; use its manifest-path.
        run: |
          cargo test -p warp_terminal_mobile_facade \
            --manifest-path warp-src/Cargo.toml \
            --no-fail-fast

      # NOTE: android-host tests are skipped in CI because the crate
      # lives in the main workspace but has a path dep into warp-src/,
      # which uses workspace dep inheritance that cargo can't resolve
      # cross-workspace. The android-host functionality is covered by
      # the 642 Kotlin JVM tests in the android-test job.
      # TODO: re-enable when warp-src becomes a proper submodule member.

  android-test:
    name: Android Kotlin compile + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync & verify companion sources
        run: bash tools/scripts/setup-companion-sources.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13113456"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - name: Render Cargo config
        run: bash tools/scripts/setup-cargo-config.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile Kotlin + run unit tests (642 tests)
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest
