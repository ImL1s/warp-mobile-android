[package]
name = "warp-mobile-android-host"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Warp Mobile Android — JNI host crate (PTY, IME, terminal model, font render, Vulkan, AI client, bootstrap extractor)"
repository = "https://github.com/ImL1s/warp-mobile-android"
# M4-S12 round-3 (codex round-2 finding): shader compile pipeline moved to
# `warp_mobile_android_link` (the canonical home for static_grid/dynamic_grid
# Vulkan rendering). This crate no longer needs a build.rs — all .spv blobs
# are include_bytes!'d from $OUT_DIR of the link crate.

[lib]
name = "warp_mobile_android_host"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
log = "0.4"
android_logger = "0.13"
# M3-S07: hand-decode of the M3-essential DProtoHook variants (Precmd,
# Preexec, CommandFinished) for Block aggregation in the mirror runtime.
# The canonical facade in warp-src already pulls these in; the mirror does
# its own hand-decode to avoid the Cargo edge to the facade rlib (which
# would re-introduce the cross-workspace dup tracked under M3-S11).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M4-S05: bootstrap zip atomic extraction.
# - sha2: SHA-256 verification of bootstrap-aarch64.zip against version.json
#   (matches the sha emitted by tools/scripts/build-bootstrap.sh).
# - zip: Deflate decompression (matches `zip -r9 -X` output from build-bootstrap.sh).
#   default-features=false drops the heavy bzip2/zstd/lzma deps we don't need.
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# M4-S12: shared rlib hosting the canonical `static_grid` + `dynamic_grid` +
# `ime` state-machine implementations (Option D shared-rlib API split). This
# eliminates the M2-era + M3-S08 cross-workspace mirrors tracked under
# M3-S11-result.json `next_milestone_action`. The crate sits in the
# warp-src workspace (`warp-src/crates/warp_mobile_android_link/`) so the
# canonical impl lives next to the warpui consumer; the path dep here is how
# the main-repo cdylib pulls it in. Top-level (un-cfg-gated) because the
# `ime` module is host-buildable (pure Rust + atomics + `log`) so
# `cargo test -p warp-mobile-android-host` exercises the IME state machine
# without cross-compilation; the Vulkan/cosmic-text-gated `static_grid` /
# `dynamic_grid` modules are gated INSIDE the link crate's own lib.rs and
# stay no-ops on host. Verified Metal-clean via
# `cargo tree -p warp_mobile_android_link --target aarch64-linux-android |
# grep -i metal` returning empty.
warp_mobile_android_link = { path = "../../warp-src/crates/warp_mobile_android_link" }
warp_terminal_mobile_facade = { path = "../../warp-src/crates/warp_terminal_mobile_facade" }

# M6-S03 round-2: Anthropic Claude async client (warp_ai_mobile crate
# in this same workspace). Top-level (not Android-target-only) because
# the host-side smoke tests for the JNI shim's argument decoding can
# call into messages_complete with mocked HTTP — no real Android
# dependencies in the call path.
warp_ai_mobile = { path = "../warp_ai_mobile" }
# Tokio for the per-call current-thread runtime that drives the async
# messages_complete call from the synchronous JNI thread. Round-3
# will replace per-call runtime with a global singleton.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }
# M6-S03 round-3: CancellationToken for stream abort. Comes from
# tokio-util but android-host needs direct access (StreamHandle holds
# CancellationToken; cancel JNI calls .cancel() directly). The
# warp_ai_mobile crate also depends on this so the token type matches
# across the FFI boundary.
tokio-util = "0.7"
# V1-prep iteration 41 (2026-05-03): East Asian Wide / Fullwidth cell-advance.
# Used by handle_ground_byte to decide whether a decoded char takes 1 or 2
# terminal cells, so CJK glyphs occupy the visual space they need rather than
# rendering squeezed inside one column. Same crate Warp Desktop uses for
# wide-char layout (warp-src/crates/warp_terminal/Cargo.toml).
unicode-width = "0.1"

[dev-dependencies]
# M4-S05: tempdir for bootstrap module unit tests (host-side).
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9"
ndk-sys = "0.6"
# M2-S04: Vulkan via ash + ANativeWindow. The CANONICAL implementation is in
# `warp-src/crates/warpui/src/platform/android/vulkan.rs` (per M2-S04 AC#1).
# This crate hosts an equivalent runtime harness because cross-workspace path
# deps (warp-src has its own `workspace.package` inheritance not present in
# the main repo) would require a major refactor of warpui's manifest. Both
# implementations follow the same M0 spike (`spikes/vulkan-surface-recreate/`)
# pattern. The harness here is the production runtime path until M3 unifies
# the workspaces.
ash = "0.38"
# M2-S05: PNG encoding for `request_frame_capture`. Pure-Rust, no system deps,
# cross-compiles cleanly to aarch64-linux-android. Chosen over `image` because
# image's default features pull in JPEG/GIF/etc. decoders we don't need; the
# `png` crate is image's underlying PNG codec anyway.
# Ref: <https://github.com/image-rs/image-png>
png = { version = "0.17", default-features = false }
# M2-S07: cosmic-text + fontdb for the device-side font-render harness.
# The CANONICAL FontDB lives in `warp-src/crates/warpui/src/platform/android/font.rs`
# (mirrors the desktop windowing/winit/fonts.rs); this crate mirrors the
# subset needed to verify "Hello, 世界" glyph rasterization on device end-to-
# end without depending on warpui (cross-workspace gap noted above).
# Same warpdotdev fork rev as warpui so behaviour matches.
# Refs:
#   <https://github.com/warpdotdev/cosmic-text>
#   <https://github.com/pop-os/cosmic-text/issues/243>
cosmic-text = { git = "https://github.com/warpdotdev/cosmic-text.git", rev = "15198beba692162201c0ea8b15222cf5643ea068" }
fontdb = "0.23.0"
